[project]
name = "bugmaze"
version = "0.1.0"
description = "Offline RL on OGBench antmaze-large with a wall-clip warp bug in the data (stage 1 of an unlearning study)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "torch>=2.4",
    "ogbench>=1.1",  # brings mujoco, dm_control and gymnasium
    "gymnasium>=1.0",
    "matplotlib>=3.8",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "pillow>=10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bugmaze"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731", "B905"]  # small named lambdas for local helpers; zip(strict=) not required

[tool.ruff.lint.isort]
known-first-party = ["bugmaze"]
